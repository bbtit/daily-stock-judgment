[project]
name = "daily-stock-judgment"
version = "0.1.0"
description = "Personal Japan stock daily judgment tool"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.12",
]

[project.scripts]
daily-stock-judgment = "daily_stock_judgment.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pytest-playwright>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_stock_judgment"]

[tool.hatch.build.targets.wheel.force-include]
"src/daily_stock_judgment/presentation/templates" = "daily_stock_judgment/presentation/templates"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: browser end-to-end tests (Playwright)",
]
